  # them to window.__envs, otherwise the client shows "undefined stats".
  NEXT_PUBLIC_NETWORK_NAME: Hanzo
  NEXT_PUBLIC_NETWORK_SHORT_NAME: HANZO
  NEXT_PUBLIC_NETWORK_CURRENCY_NAME: Hanzo AI
  NEXT_PUBLIC_NETWORK_CURRENCY_SYMBOL: AI
  NEXT_PUBLIC_NETWORK_CURRENCY_DECIMALS: "18"
  NEXT_PUBLIC_NETWORK_ID: "36963"
  NEXT_PUBLIC_IS_TESTNET: "false"
  NEXT_PUBLIC_API_HOST: api-explore.hanzo.network
  NEXT_PUBLIC_APP_HOST: explore.hanzo.network
  NEXT_PUBLIC_NETWORK_RPC_URL: https://api.hanzo.network/v1/bc/C/rpc
  NEXT_PUBLIC_STATS_API_HOST: https://api-explore.hanzo.network
  NEXT_PUBLIC_VISUALIZE_API_HOST: https://api-explore.hanzo.network
  NEXT_PUBLIC_CONTRACT_INFO_API_HOST: https://api-explore.hanzo.network
  NEXT_PUBLIC_ADMIN_SERVICE_API_HOST: https://api-explore.hanzo.network
  # Sign-in via Hanzo IAM, Hanzo's own org. hanzo-explore carries callbacks for
  # BOTH explore.hanzo.network and explore.hanzo.ai — one deployment, two
  # hostnames, one client. See explore-env-lux on the client-id naming.
  NEXT_PUBLIC_IS_ACCOUNT_SUPPORTED: "true"
  NEXT_PUBLIC_ACCOUNT_AUTH_PROVIDER: oidc
  NEXT_PUBLIC_OIDC_SERVER_URL: https://hanzo.id
  NEXT_PUBLIC_OIDC_CLIENT_ID: hanzo-explore
  # See explore-env-zoo: brand identity is baked in the image; skip the
  # runtime envs-validator so the absent NETWORK_NAME placeholder doesn't crashloop.
  SKIP_ENVS_VALIDATION: "true"
