---
# Lux Testnet — canonical brand image + env from ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: explore-fe-lux
  namespace: lux-testnet
  labels: {app: explore-fe, brand: lux, network: testnet}
spec:
  replicas: 2
  selector:
    matchLabels: {app: explore-fe, brand: lux, network: testnet}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 1, maxSurge: 1}
  template:
    metadata:
      labels: {app: explore-fe, brand: lux, network: testnet}
    spec:
      imagePullSecrets: [{name: ghcr-luxfi}]
      containers:
        - name: explore
          image: ghcr.io/luxfi/explore:v1.0.1
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 3000, name: ui}]
          env:
            - {name: PORT, value: "3000"}
          envFrom:
            - configMapRef: {name: explore-env-lux}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 1, memory: 2Gi}
          startupProbe:
            httpGet: {path: /, port: ui}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /, port: ui}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet: {path: /, port: ui}
            initialDelaySeconds: 90
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: explore-fe-lux
  namespace: lux-testnet
  labels: {app: explore-fe, brand: lux, network: testnet}
spec:
  type: ClusterIP
  selector: {app: explore-fe, brand: lux, network: testnet}
  ports: [{name: http, port: 80, targetPort: 3000, protocol: TCP}]
