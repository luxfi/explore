---
# Lux Mainnet: explore.lux.network + explorer.lux.network → explore-fe-lux + Go binary API
apiVersion: hanzo.ai/v1alpha1
kind: IngressRoute
metadata:
  name: lux-explorer-mainnet
  namespace: lux-mainnet
  labels: {app: lux-explorer, network: mainnet}
spec:
  entryPoints: [websecure]
  tls: {certResolver: letsencrypt}
  routes:
    # Brand assets + health → Go binary (port 8090). Data paths do NOT belong
    # here: `explore.*` is the frontend, `api-explore.*` is the API — one
    # concern per host. A `PathPrefix(/v1/)` term here used to swallow the
    # frontend's OWN server routes (/v1/pchain, /v1/config, /v1/csrf), which
    # 404d and rendered the validators page as 0 validators / 0 LUX staked.
    - kind: Rule
      priority: 10000
      match: (Host(`explore.lux.network`) || Host(`explorer.lux.network`)) && (Path(`/health`) || Path(`/envs.js`) || Path(`/icon.svg`) || Path(`/logo.svg`) || Path(`/icon-zoo.svg`) || Path(`/icon-lux.svg`) || Path(`/logo-zoo.svg`) || Path(`/logo-lux.svg`))
      middlewares: [{name: cors-allow-all}]
      services: [{name: explorer, port: 8090}]
    # Catch-all → per-brand Next.js FE (port 80 → 3000)
    - kind: Rule
      match: Host(`explore.lux.network`) || Host(`explorer.lux.network`)
      services: [{name: explore-fe-lux, port: 80}]
    # api-explore.lux.network — every /v1/* path the Go binary serves verbatim
    # (indexer, explorer, graph, base/realtime, AND the stats surface
    # /v1/counters,/v1/lines,/v1/pages/*). Enumerating four of them left the
    # stats microservice paths falling into the catch-all below, which
    # prefixed them into /v1/indexer/cchain/v1/counters → 404.
    - kind: Rule
      match: (Host(`api-explore.lux.network`) || Host(`api-explorer.lux.network`)) && (PathPrefix(`/v1/`) || Path(`/health`))
      middlewares: [{name: cors-allow-all}]
      services: [{name: explorer, port: 8090}]
    # api-explore.lux.network — catch-all: Blockscout-shaped paths get the
    # /v1/indexer/{slug} prefix. NO mainpage-rewrite: the Go binary serves
    # /main-page/* verbatim, so rewriting it to /homepage/* 404s.
    - kind: Rule
      match: Host(`api-explore.lux.network`) || Host(`api-explorer.lux.network`)
      middlewares: [{name: blockscout-prefix-cchain}, {name: cors-allow-all}]
      services: [{name: explorer, port: 8090}]
---
# Lux C-Chain (umbrella → re-uses explore-fe-lux because it IS the Lux primary)
apiVersion: hanzo.ai/v1alpha1
kind: IngressRoute
metadata:
  name: lux-explorer-cchain
  namespace: lux-mainnet
  labels: {app: lux-explorer, chain: cchain, network: mainnet}
spec:
  entryPoints: [websecure]
  tls: {certResolver: letsencrypt}
  routes:
    - kind: Rule
      priority: 10000
      match: (Host(`explore-cchain.lux.network`) || Host(`explore-c.lux.network`)) && (Path(`/health`) || Path(`/envs.js`) || Path(`/icon.svg`) || Path(`/logo.svg`))
      middlewares: [{name: cors-allow-all}]
      services: [{name: explorer, port: 8090}]
    - kind: Rule
      match: Host(`explore-cchain.lux.network`) || Host(`explore-c.lux.network`)
      services: [{name: explore-fe-lux, port: 80}]
    - kind: Rule
      match: (Host(`api-explore-cchain.lux.network`) || Host(`api-explore-c.lux.network`)) && (PathPrefix(`/v1/`) || Path(`/health`))
      middlewares: [{name: cors-allow-all}]
      services: [{name: explorer, port: 8090}]
    - kind: Rule
      match: Host(`api-explore-cchain.lux.network`) || Host(`api-explore-c.lux.network`)
      middlewares: [{name: blockscout-prefix-cchain}, {name: cors-allow-all}]
      services: [{name: explorer, port: 8090}]
