---
# Lux Testnet
apiVersion: hanzo.ai/v1alpha1
kind: IngressRoute
metadata:
  name: lux-explorer-testnet
  namespace: lux-testnet
  labels: {app: lux-explorer, network: testnet}
spec:
  entryPoints: [websecure]
  tls: {certResolver: letsencrypt}
  routes:
    - kind: Rule
      priority: 10000
      match: (Host(`explore.lux-test.network`) || Host(`explorer.lux-test.network`) || Host(`explore-test.lux.network`)) && (Path(`/health`) || Path(`/envs.js`) || Path(`/icon.svg`) || Path(`/logo.svg`) || Path(`/icon-zoo.svg`) || Path(`/icon-lux.svg`) || Path(`/logo-zoo.svg`) || Path(`/logo-lux.svg`))
      middlewares: [{name: cors-allow-all}]
      services: [{name: explorer, port: 8090}]
    - kind: Rule
      match: Host(`explore.lux-test.network`) || Host(`explorer.lux-test.network`) || Host(`explore-test.lux.network`)
      services: [{name: explore-fe-lux, port: 80}]
    - kind: Rule
      match: (Host(`api-explore.lux-test.network`) || Host(`api-explorer.lux-test.network`) || Host(`api-explore-test.lux.network`)) && (PathPrefix(`/v1/`) || Path(`/health`))
      middlewares: [{name: cors-allow-all}]
      services: [{name: explorer, port: 8090}]
    - kind: Rule
      match: Host(`api-explore.lux-test.network`) || Host(`api-explorer.lux-test.network`) || Host(`api-explore-test.lux.network`)
      middlewares: [{name: blockscout-prefix-cchain}, {name: cors-allow-all}]
      services: [{name: explorer, port: 8090}]
