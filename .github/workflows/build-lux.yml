name: Build and Deploy LUX Explorer

# Builds the Lux-branded explorer image only. The source supports
# white-label brand selection at runtime (lib/white-label.ts inspects
# hostname or NEXT_PUBLIC_BRAND), so a single image serves any brand
# at deploy time. Per-brand images for hanzo / zoo / pars are built
# from each brand's own org repo (ghcr.io/hanzoai, ghcr.io/zooai, …) —
# never from this repo.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.mdx"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: lux-build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: lux-build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/luxfi/explore
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Resolve app version
        id: appversion
        # Footer shows NEXT_PUBLIC_GIT_TAG. On a branch push there is no git tag,
        # so bake the package.json version (single source) as v<version>.
        run: |
          v=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          echo "tag=v${v}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=lux
          cache-to: type=gha,mode=max,scope=lux
          provenance: false
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            GIT_TAG=${{ github.ref_type == 'tag' && github.ref_name || steps.appversion.outputs.tag }}
            NEXT_PUBLIC_BRAND=lux

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: lux-build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Fetch deploy credentials from KMS
        id: kms
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          HANZO_API_KEY: ${{ secrets.HANZO_API_KEY }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://kms.hanzo.ai' }}
          DO_FALLBACK_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          if [ -n "${KMS_CLIENT_ID}" ] && [ -n "${KMS_CLIENT_SECRET}" ]; then
            HANZO_API_KEY=$(curl -sf "${KMS_ENDPOINT}/api/v1/auth/universal-auth/login" \
              -H "Content-Type: application/json" \
              -d "{\"clientId\":\"${KMS_CLIENT_ID}\",\"clientSecret\":\"${KMS_CLIENT_SECRET}\"}" | jq -r '.accessToken')
          fi
          response=$(curl -sf "${KMS_ENDPOINT}/api/v3/secrets/raw?workspaceId=e1359bf4-31b4-4dfa-bb90-323e2c298ad8&secretPath=/deploy&environment=prod" \
            -H "Authorization: Bearer ${HANZO_API_KEY}" 2>/dev/null || echo "")
          if [ -n "$response" ]; then
            token=$(echo "$response" | jq -r '.secrets[] | select(.secretKey=="DO_API_TOKEN") | .secretValue // empty')
          fi
          # KMS is the source of truth for the DO token; fall back to the repo's
          # DigitalOcean token secret when KMS has no /deploy DO_API_TOKEN entry.
          if [ -z "${token:-}" ]; then
            token="${DO_FALLBACK_TOKEN}"
          fi
          if [ -z "${token:-}" ]; then
            echo "::warning::Deploy credentials not found. Image was pushed but deployment skipped."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::${token}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"

      - name: Deploy to production
        if: steps.kms.outputs.skip != 'true'
        env:
          DO_TOKEN: ${{ steps.kms.outputs.token }}
        run: |
          INSTALL_DIR="$HOME/.local/bin"
          mkdir -p "$INSTALL_DIR"
          export PATH="$INSTALL_DIR:$PATH"
          if ! command -v doctl &>/dev/null; then
            DOCTL_VERSION=$(curl -sI https://github.com/digitalocean/doctl/releases/latest | grep -i '^location:' | sed 's|.*/v||;s/\r//')
            curl -sL "https://github.com/digitalocean/doctl/releases/download/v${DOCTL_VERSION}/doctl-${DOCTL_VERSION}-linux-amd64.tar.gz" | tar xz -C "$INSTALL_DIR"
          fi
          if ! command -v kubectl &>/dev/null; then
            curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl && mv kubectl "$INSTALL_DIR/kubectl"
          fi
          doctl auth init -t "$DO_TOKEN"
          doctl kubernetes cluster kubeconfig save lux-k8s

          for ns in lux-mainnet lux-testnet lux-devnet; do
            kubectl create namespace $ns 2>/dev/null || true
          done

          kubectl apply -f deploy/k8s/stats.yaml -n lux-mainnet || true
          kubectl rollout restart deployment/lux-stats -n lux-mainnet 2>/dev/null || true

          # The Lux-branded FE image built by this run. metadata-action tags it
          # sha-<7-char-short> (see the build job). IfNotPresent + a fresh
          # immutable sha tag guarantees each rollout pulls the new bits.
          IMAGE="${REGISTRY}/luxfi/explore:sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "Rolling explore-fe-lux -> ${IMAGE}"

          # explore-fe-lux is the Deployment that serves explore.lux.network (see
          # deploy/k8s/explore-fe/deployments-mainnet.yaml + the mainnet
          # ingressroute). Roll it across every network; testnet/devnet best-effort.
          kubectl -n lux-testnet set image deployment/explore-fe-lux explore="${IMAGE}" 2>/dev/null || true
          kubectl -n lux-devnet  set image deployment/explore-fe-lux explore="${IMAGE}" 2>/dev/null || true
          kubectl -n lux-mainnet set image deployment/explore-fe-lux explore="${IMAGE}"

          kubectl -n lux-mainnet rollout status deployment/explore-fe-lux --timeout=300s
